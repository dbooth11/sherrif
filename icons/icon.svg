<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="24" ry="24" fill="url(#bg)"/>
  <!-- Share icon: three circles connected by lines -->
  <!-- Top-right node -->
  <circle cx="82" cy="34" r="12" fill="none" stroke="white" stroke-width="5"/>
  <!-- Middle-left node -->
  <circle cx="46" cy="64" r="12" fill="none" stroke="white" stroke-width="5"/>
  <!-- Bottom-right node -->
  <circle cx="82" cy="94" r="12" fill="none" stroke="white" stroke-width="5"/>
  <!-- Connecting lines -->
  <line x1="56" y1="58" x2="72" y2="40" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="56" y1="70" x2="72" y2="88" stroke="white" stroke-width="5" stroke-linecap="round"/>
</svg>
