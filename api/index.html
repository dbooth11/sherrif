<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>API Test Console</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { padding: 20px; }
    textarea { font-family: monospace; }
    .result-box {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 5px;
      min-height: 120px;
      white-space: pre-wrap;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <div class="container">

    <h2 class="mb-4">PHP API Test Console</h2>

    <!-- API base -->
    <div class="card mb-4">
      <div class="card-body">
        <label class="form-label fw-bold">API Base URL</label>
        <input id="apiBase" type="text" class="form-control" value="http://www.dbooth.net/api">
      </div>
    </div>

    <!-- SEND LINK -->
    <div class="card mb-4">
      <div class="card-header"><strong>send_link.php</strong> (POST)</div>
      <div class="card-body">
        <div class="row mb-2">
          <div class="col">
            <input id="send_sender" class="form-control" value="1" placeholder="sender_id (e.g. 1)">
          </div>
          <div class="col">
            <input id="send_receiver" class="form-control" value="2" placeholder="receiver_id (e.g. 2)">
          </div>
        </div>
        <input id="send_url" class="form-control mb-2" value="http://cnn.com" placeholder="URL">
        <input id="send_title" class="form-control mb-2" value="Testy" placeholder="Title">
        <button class="btn btn-primary mb-2" onclick="sendLink()">Send Link</button>
        <div class="result-box" id="send_result"></div>
      </div>
    </div>

    <!-- GET LINKS -->
    <div class="card mb-4">
      <div class="card-header"><strong>get_links.php</strong> (GET)</div>
      <div class="card-body">
        <div class="row mb-2">
          <div class="col">
            <input id="links_receiver" class="form-control" placeholder="receiver_id">
          </div>
          <div class="col">
            <input id="links_limit" class="form-control" placeholder="limit (default=6)">
          </div>
        </div>
        <button class="btn btn-primary mb-2" onclick="getLinks()">Get Links</button>
        <div class="result-box" id="links_result"></div>
      </div>
    </div>

    <!-- GET UNREAD COUNT -->
    <div class="card mb-4">
      <div class="card-header"><strong>get_unread_count.php</strong> (GET)</strong></div>
      <div class="card-body">
        <input id="unread_receiver" class="form-control mb-2" placeholder="receiver_id">
        <button class="btn btn-primary mb-2" onclick="getUnread()">Get Unread Count</button>
        <div class="result-box" id="unread_result"></div>
      </div>
    </div>

    <!-- MARK READ -->
    <div class="card mb-4">
      <div class="card-header"><strong>mark_read.php</strong> (POST)</div>
      <div class="card-body">
        <input id="mark_receiver" class="form-control mb-2" placeholder="receiver_id">
        <textarea id="mark_ids" class="form-control mb-2" placeholder="[1, 2, 3] JSON array of link_ids" rows="3"></textarea>
        <button class="btn btn-primary mb-2" onclick="markRead()">Mark Read</button>
        <div class="result-box" id="mark_result"></div>
      </div>
    </div>

  </div>

  <script>
    function api(path) {
      const base = document.getElementById('apiBase').value.replace(/\/$/, "");
      return base + path;
    }

    async function sendLink() {
      const body = {
        sender_id: parseInt(document.getElementById("send_sender").value),
        receiver_id: parseInt(document.getElementById("send_receiver").value),
        url: document.getElementById("send_url").value,
        title: document.getElementById("send_title").value
      };

      const res = await fetch(api("/send_link.php"), {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });

      document.getElementById("send_result").textContent = await res.text();
    }

    async function getLinks() {
      const receiver = document.getElementById("links_receiver").value;
      const limit = document.getElementById("links_limit").value || 6;

      const res = await fetch(api(`/get_links.php?receiver_id=${receiver}&limit=${limit}`));
      document.getElementById("links_result").textContent = await res.text();
    }

    async function getUnread() {
      const receiver = document.getElementById("unread_receiver").value;

      const res = await fetch(api(`/get_unread_count.php?receiver_id=${receiver}`));
      document.getElementById("unread_result").textContent = await res.text();
    }

    async function markRead() {
      let ids;
      try {
        ids = JSON.parse(document.getElementById("mark_ids").value);
      } catch {
        alert("Invalid JSON in link_ids");
        return;
      }

      const body = {
        receiver_id: parseInt(document.getElementById("mark_receiver").value),
        link_ids: ids
      };

      const res = await fetch(api(`/mark_read.php`), {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });

      document.getElementById("mark_result").textContent = await res.text();
    }
  </script>

</body>
</html>
