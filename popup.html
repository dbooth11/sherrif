<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Friend Link Sender</title>
    <style>
      /* Base reset */
      *, *::before, *::after { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        margin: 0;
        min-width: 320px;
        padding: 10px;
        background: #fff;
        color: #212529;
      }
      a { color: #0d6efd; text-decoration: none; }
      a:hover { text-decoration: underline; }
      h5, h6 { margin-top: 0; margin-bottom: 0.5rem; font-weight: 500; }
      h5 { font-size: 1.1rem; }
      h6 { font-size: 1rem; }
      ul { padding-left: 0; margin: 0; }

      /* Layout utilities */
      .container-fluid { width: 100%; }
      .d-flex { display: flex; }
      .d-none { display: none !important; }
      .justify-content-between { justify-content: space-between; }
      .align-items-center { align-items: center; }
      .w-100 { width: 100%; }
      .text-center { text-align: center; }

      /* Spacing */
      .mb-0 { margin-bottom: 0 !important; }
      .mb-1 { margin-bottom: 0.25rem !important; }
      .mb-2 { margin-bottom: 0.5rem !important; }
      .mb-3 { margin-bottom: 1rem !important; }
      .mt-2 { margin-top: 0.5rem !important; }
      .me-1 { margin-right: 0.25rem !important; }
      .p-2 { padding: 0.5rem !important; }
      .py-3 { padding-top: 1rem !important; padding-bottom: 1rem !important; }

      /* Text */
      .small { font-size: 0.85rem; }
      .fw-bold { font-weight: 700 !important; }
      .text-muted { color: #6c757d !important; }
      .text-primary { color: #0d6efd !important; }
      .text-success { color: #198754 !important; }
      .text-danger { color: #dc3545 !important; }
      .list-unstyled { list-style: none; }

      /* Badge */
      .badge {
        display: inline-block;
        padding: 0.25em 0.5em;
        font-size: 0.75em;
        font-weight: 700;
        line-height: 1;
        text-align: center;
        white-space: nowrap;
        vertical-align: baseline;
        border-radius: 0.375rem;
      }
      .bg-secondary { background-color: #6c757d !important; color: #fff; }
      .bg-success { background-color: #198754 !important; color: #fff; }

      /* Card */
      .card {
        background-color: #fff;
        border: 1px solid rgba(0,0,0,.125);
        border-radius: 0.375rem;
      }
      .card-body { padding: 1rem; }
      .card-title { margin-bottom: 0.5rem; }

      /* Form controls */
      .form-label {
        display: block;
        margin-bottom: 0.25rem;
        font-weight: 500;
      }
      .form-control {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        transition: border-color .15s ease-in-out;
      }
      .form-control:focus {
        border-color: #86b7fe;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25);
      }
      .form-control-sm {
        padding: 0.25rem 0.5rem;
        font-size: 0.875rem;
        border-radius: 0.25rem;
      }

      /* Button */
      .btn {
        display: inline-block;
        font-weight: 400;
        text-align: center;
        vertical-align: middle;
        cursor: pointer;
        user-select: none;
        border: 1px solid transparent;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        line-height: 1.5;
        border-radius: 0.375rem;
        transition: color .15s ease-in-out, background-color .15s ease-in-out;
      }
      .btn-primary {
        color: #fff;
        background-color: #0d6efd;
        border-color: #0d6efd;
      }
      .btn-primary:hover { background-color: #0b5ed7; border-color: #0a58ca; }
      .btn-primary:disabled { background-color: #0d6efd; opacity: 0.65; }
      .btn-sm {
        padding: 0.25rem 0.5rem;
        font-size: 0.875rem;
        border-radius: 0.25rem;
      }

      /* Custom styles */
      #linksList {
        max-height: 260px;
        overflow-y: auto;
      }
      .link-item-title {
        font-size: 0.9rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .link-item-meta {
        font-size: 0.7rem;
      }
      .link-item {
        padding: 8px;
        margin-bottom: 8px;
        border-radius: 4px;
      }
      .link-item.from-don { background-color: #e3f2fd; }
      .link-item.from-kev { background-color: #f3e5f5; }
      .link-item.from-other { background-color: #f5f5f5; }
      .archive-link { text-decoration: none; }
      .archive-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="container-fluid">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">
          <a href="https://dbooth11.github.io/sherrif/" target="_blank" class="archive-link">Archive</a>
        </h5>
        <span class="badge bg-secondary">v2.0</span>
      </div>

      <!-- Setup Card (shown first time only) -->
      <div class="card mb-3" id="setupCard">
        <div class="card-body py-3">
          <h6 class="card-title mb-3">Setup</h6>

          <div class="mb-2">
            <label class="form-label mb-1" for="userSelect">Who are you?</label>
            <select
              id="userSelect"
              class="form-control form-control-sm"
              autofocus
            >
              <option value="Kev:Don">Kev → Don</option>
              <option value="Don:Kev">Don → Kev</option>

            </select>
          </div>

          <div class="mb-3">
            <label class="form-label mb-1" for="gistToken">GitHub Token</label>
            <input
              id="gistToken"
              type="password"
              class="form-control form-control-sm"
              placeholder="ghp_..."
            />
          </div>

          <button id="saveSettings" class="btn btn-primary btn-sm w-100">
            Plug into the Matrix
          </button>
        </div>
      </div>

      <!-- Main Content (shown after setup) -->
      <div id="mainContent" class="d-none">
        <!-- Quick Send -->
        <div class="card mb-3">
          <div class="card-body p-2">
            <button id="sendBtn" class="btn btn-primary btn-sm w-100">
              Send to Friend
            </button>
            <div id="status" class="small text-center mt-2" style="min-height: 16px;"></div>
          </div>
        </div>

        <!-- Links -->
        <div class="card">
          <div class="card-body p-2">
            <input
              id="searchInput"
              type="text"
              class="form-control form-control-sm mb-2"
              placeholder="Search links..."
            />
            <ul id="linksList" class="list-unstyled mb-0"></ul>
          </div>
        </div>
      </div>

    </div>

    <script src="popup.js"></script>
  </body>
</html>
