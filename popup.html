<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Shareff</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <h5 class="header-title">Shareff</h5>
      <div class="header-actions">
        <a href="https://dbooth11.github.io/sherrif/" target="_blank">Archive</a>
        <button id="settingsBtn" class="btn btn-sm">Settings</button>
      </div>
    </div>

    <div class="container">
      <!-- Status -->
      <div id="status" class="small text-center mb-2" style="min-height: 20px;"></div>

      <!-- Search -->
      <input
        id="searchInput"
        type="text"
        class="form-control mb-3"
        placeholder="Search links..."
      />

      <!-- Links List -->
      <ul id="linksList" class="list-unstyled mb-0"></ul>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
