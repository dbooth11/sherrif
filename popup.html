<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PHP Fetch</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 10px;
      width: 320px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 8px;
    }
    label {
      display: block;
      font-size: 12px;
      margin: 6px 0 2px;
    }
    input[type="text"], textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      font-size: 12px;
    }
    textarea {
      min-height: 60px;
      font-family: monospace;
    }
    button {
      margin-top: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    #status {
      margin-top: 8px;
      font-size: 11px;
    }
    #result {
      margin-top: 8px;
      font-size: 11px;
      white-space: pre-wrap;
      max-height: 160px;
      overflow: auto;
      border: 1px solid #ddd;
      padding: 6px;
      border-radius: 4px;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <h1>PHP Background Fetch</h1>

  <label for="endpoint">Endpoint URL</label>
  <input id="endpoint" type="text" placeholder="https://your-server.com/api.php" />

  <label for="payload">JSON payload (optional)</label>
  <textarea id="payload" placeholder='{"hello":"world"}'></textarea>

  <button id="send">Send Request</button>

  <div id="status"></div>
  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
