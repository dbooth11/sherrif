<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Friend Link Sender</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        min-width: 320px;
        padding: 10px;
      }
      #linksList {
        max-height: 260px;
        overflow-y: auto;
      }
      .link-item-title {
        font-size: 0.9rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .link-item-meta {
        font-size: 0.7rem;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">Link Sender</h5>
        <span class="badge bg-secondary">v2.0</span>
      </div>

      <!-- Setup Card (shown first time only) -->
      <div class="card mb-3" id="setupCard">
        <div class="card-body py-3">
          <h6 class="card-title mb-3">Quick Setup</h6>

          <div class="mb-2">
            <label class="form-label mb-1" for="myName">Your name</label>
            <input
              id="myName"
              type="text"
              class="form-control form-control-sm"
              placeholder="Don or Kev"
              autofocus
            />
          </div>

          <div class="mb-2">
            <label class="form-label mb-1" for="friendName">Friend's name</label>
            <input
              id="friendName"
              type="text"
              class="form-control form-control-sm"
              placeholder="Kev or Don"
            />
          </div>

          <div class="mb-2">
            <label class="form-label mb-1" for="gistId">Gist ID</label>
            <input
              id="gistId"
              type="text"
              class="form-control form-control-sm"
              placeholder="abc123def456..."
            />
          </div>

          <div class="mb-3">
            <label class="form-label mb-1" for="gistToken">GitHub Token</label>
            <input
              id="gistToken"
              type="password"
              class="form-control form-control-sm"
              placeholder="ghp_..."
            />
          </div>

          <button id="saveSettings" class="btn btn-primary btn-sm w-100">
            Let's Go!
          </button>
        </div>
      </div>

      <!-- Main Content (shown after setup) -->
      <div id="mainContent" class="d-none">
        <!-- Quick Send -->
        <div class="card mb-3">
          <div class="card-body py-2">
            <button id="sendBtn" class="btn btn-primary btn-sm w-100 mb-2">
              Send to Friend
            </button>
            <div id="status" class="small text-center" style="min-height: 16px;"></div>
          </div>
        </div>

        <!-- Links -->
        <div class="card">
          <div class="card-body py-2">
            <div id="unreadNotice" class="small fw-semibold mb-2"></div>
            <ul id="linksList" class="list-unstyled mb-0"></ul>
          </div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
