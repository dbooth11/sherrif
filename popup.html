<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Friend Link Sender</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        min-width: 320px;
        padding: 10px;
      }
      #linksList {
        max-height: 260px;
        overflow-y: auto;
      }
      .link-item-title {
        font-size: 0.9rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .link-item-meta {
        font-size: 0.7rem;
      }
      .link-item {
        padding: 8px;
        margin-bottom: 8px;
        border-radius: 4px;
      }
      .link-item.from-don {
        background-color: #e3f2fd;
      }
      .link-item.from-kev {
        background-color: #f3e5f5;
      }
      .link-item.from-other {
        background-color: #f5f5f5;
      }
      .archive-link {
        text-decoration: none;
      }
      .archive-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">
          <a href="https://dbooth11.github.io/sherrif/" target="_blank" class="archive-link">Archive</a>
        </h5>
        <span class="badge bg-secondary">v2.0</span>
      </div>

      <!-- Setup Card (shown first time only) -->
      <div class="card mb-3" id="setupCard">
        <div class="card-body py-3">
          <h6 class="card-title mb-3">Setup</h6>

          <div class="mb-2">
            <label class="form-label mb-1" for="userSelect">Who are you?</label>
            <select
              id="userSelect"
              class="form-control form-control-sm"
              autofocus
            >
              <option value="Kev:Don">Kev → Don</option>
              <option value="Don:Kev">Don → Kev</option>

            </select>
          </div>

          <div class="mb-3">
            <label class="form-label mb-1" for="gistToken">GitHub Token</label>
            <input
              id="gistToken"
              type="password"
              class="form-control form-control-sm"
              placeholder="ghp_..."
            />
          </div>

          <button id="saveSettings" class="btn btn-primary btn-sm w-100">
            Plug into the Matrix
          </button>
        </div>
      </div>

      <!-- Main Content (shown after setup) -->
      <div id="mainContent" class="d-none">
        <!-- Quick Send -->
        <div class="card mb-3">
          <div class="card-body p-2">
            <button id="sendBtn" class="btn btn-primary btn-sm w-100">
              Send to Friend
            </button>
            <div id="status" class="small text-center mt-2" style="min-height: 16px;"></div>
          </div>
        </div>

        <!-- Links -->
        <div class="card">
          <div class="card-body p-2">
            <input
              id="searchInput"
              type="text"
              class="form-control form-control-sm mb-2"
              placeholder="Search links..."
            />
            <ul id="linksList" class="list-unstyled mb-0"></ul>
          </div>
        </div>
      </div>

    </div>

    <script src="popup.js"></script>
  </body>
</html>
