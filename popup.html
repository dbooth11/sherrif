<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Friend Link Sender</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        min-width: 360px;
        padding: 10px;
      }
      #linksList {
        max-height: 220px;
        overflow-y: auto;
      }
      .link-item-title {
        font-size: 0.95rem;
        font-weight: 500;
      }
      .link-item-meta {
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">Friend Link Sender</h5>
        <span class="badge bg-primary">v1.0</span>
      </div>

      <!-- Settings card -->
      <div class="card mb-3">
        <div class="card-body py-2">
          <h6 class="card-title mb-2">Settings</h6>

          <div class="mb-2">
            <label class="form-label mb-1" for="apiBase">API base URL</label>
            <input
              id="apiBase"
              type="text"
              class="form-control form-control-sm"
              placeholder="https://yourdomain.com/api"
            />
          </div>

          <div class="mb-2">
            <label class="form-label mb-1" for="apiToken">
              API token (optional)
            </label>
            <input
              id="apiToken"
              type="text"
              class="form-control form-control-sm"
              placeholder="e.g. 64-char token"
            />
            <div class="form-text">
              Leave empty if your API doesn't require a token header.
            </div>
          </div>

          <div class="row">
            <div class="col-6 mb-2">
              <label class="form-label mb-1" for="myUserId">My user ID</label>
              <input
                id="myUserId"
                type="number"
                class="form-control form-control-sm"
                placeholder="e.g. 2"
              />
            </div>
            <div class="col-6 mb-2">
              <label class="form-label mb-1" for="friendUserId">Friend user ID</label>
              <input
                id="friendUserId"
                type="number"
                class="form-control form-control-sm"
                placeholder="e.g. 1"
              />
            </div>
          </div>

          <button id="saveSettings" class="btn btn-secondary btn-sm w-100">
            Save settings
          </button>
        </div>
      </div>

      <!-- Actions card -->
      <div class="card mb-3">
        <div class="card-body py-2">
          <button id="sendBtn" class="btn btn-primary btn-sm w-100 mb-2">
            Send current page to friend
          </button>
          <div id="status" class="small text-muted" style="min-height: 16px;"></div>
        </div>
      </div>

      <!-- Unread + links card -->
      <div class="card">
        <div class="card-body py-2">
          <div
            id="unreadNotice"
            class="small fw-semibold mb-2 text-primary"
          ></div>

          <h6 class="mb-2">Last 6 links sent to me</h6>
          <ul id="linksList" class="list-unstyled mb-0"></ul>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
