<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Archive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #00ff00;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #888;
      font-size: 1.1rem;
    }

    .stats {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    .stat {
      background: #1a1a1a;
      padding: 15px 25px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: #00ff00;
    }

    .stat-label {
      color: #888;
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .filters {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #333;
      margin-bottom: 30px;
    }

    .filter-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-group label {
      color: #888;
      font-size: 0.9rem;
    }

    .filter-group input,
    .filter-group select {
      background: #0a0a0a;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      outline: none;
      border-color: #00ff00;
    }

    .links-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link-card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      transition: all 0.2s;
    }

    .link-card:hover {
      border-color: #00ff00;
      transform: translateY(-2px);
    }

    .link-card.unread {
      border-left: 4px solid #00ff00;
    }

    .link-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .link-title {
      flex: 1;
      min-width: 200px;
    }

    .link-title a {
      color: #00ff00;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      word-break: break-word;
    }

    .link-title a:hover {
      text-decoration: underline;
    }

    .link-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
    }

    .badge.unread {
      background: #00ff0020;
      color: #00ff00;
      border: 1px solid #00ff00;
    }

    .badge.read {
      background: #33333320;
      color: #888;
      border: 1px solid #444;
    }

    .badge.sender {
      background: #0066ff20;
      color: #4d9fff;
      border: 1px solid #0066ff;
    }

    .link-meta {
      display: flex;
      gap: 20px;
      color: #888;
      font-size: 0.85rem;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .link-url {
      color: #666;
      font-size: 0.85rem;
      margin-top: 8px;
      word-break: break-all;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 1.2rem;
    }

    .error {
      background: #ff000020;
      border: 1px solid #ff0000;
      color: #ff6666;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 1.1rem;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .stats {
        flex-direction: column;
      }

      .stat {
        width: 100%;
      }

      .filter-group {
        flex-direction: column;
        align-items: stretch;
      }

      .filter-group input,
      .filter-group select {
        width: 100%;
      }
    }

    .refresh-btn {
      background: #00ff00;
      color: #0a0a0a;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: #00cc00;
      transform: scale(1.05);
    }

    .login-form {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 40px;
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }

    .login-form h2 {
      color: #00ff00;
      margin-bottom: 10px;
    }

    .login-form p {
      color: #888;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      color: #888;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 12px;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: #00ff00;
    }

    .login-form button {
      width: 100%;
      margin-top: 10px;
    }

    .logout-btn {
      background: #ff3333;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: #cc0000;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Link Archive</h1>
      <p class="subtitle">Shared links between friends</p>
    </header>

    <div id="linksContainer">
      <div class="loading">Loading links...</div>
    </div>
  </div>

  <script>
    // Optional: Load config.js if it exists for backwards compatibility
    const script = document.createElement('script');
    script.src = 'config.js';
    script.onerror = () => console.log('No config.js found, will use localStorage');
    document.head.appendChild(script);
  </script>
  <script src="app.js"></script>
</body>
</html>
